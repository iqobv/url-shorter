services:
  db:
    container_name: url-shorter-db-local
    image: postgres:18.1
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - url-shorter-network
    volumes:
      - pgdata-local:/var/lib/postgresql

volumes:
  pgdata-local:

networks:
  url-shorter-network:
